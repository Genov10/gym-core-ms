server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Helpful when debugging 502 (see: docker compose logs nginx)
    error_log /dev/stderr warn;

    # Large cookies / Laravel session headers on requests
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Big FastCGI response headers (Set-Cookie, etc.) — first buffer matters most.
        # Keep total buffers moderate: very large fastcgi_buffers × workers can starve RAM on small VPS.
        fastcgi_buffer_size 256k;
        fastcgi_buffers 32 32k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

